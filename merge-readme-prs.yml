name: Merge README-only PRs

# Run manually: Actions tab → "Merge README-only PRs" → Run workflow.
# Finds open PRs across every repo you own and merges the ones that ONLY
# change README files. Everything else is skipped and reported.

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "GitHub user/org whose repos to scan"
        default: "HashimKhan0"
        required: true
      dry_run:
        description: "Dry run: list what would be merged, merge nothing"
        type: boolean
        default: true
      merge_method:
        description: "Merge method"
        type: choice
        options: [squash, merge, rebase]
        default: squash
      delete_branch:
        description: "Delete the PR branch after merging"
        type: boolean
        default: true

permissions: {}   # the built-in GITHUB_TOKEN isn't used; all calls go through the PAT below

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          OWNER: ${{ inputs.owner }}
          DRY_RUN: ${{ inputs.dry_run }}
          MERGE_METHOD: ${{ inputs.merge_method }}
          DELETE_BRANCH: ${{ inputs.delete_branch }}
        with:
          # The default GITHUB_TOKEN can only touch THIS repo, so a
          # cross-repo job needs a personal access token (see setup notes).
          github-token: ${{ secrets.README_MERGE_TOKEN }}
          script: |
            const owner        = process.env.OWNER;
            const dryRun       = process.env.DRY_RUN === 'true';
            const mergeMethod  = process.env.MERGE_METHOD;
            const deleteBranch = process.env.DELETE_BRANCH === 'true';

            // A file counts as a README if its name (in any folder) is README / README.md / readme.txt etc.
            const isReadme = (path) => /(^|\/)readme(\.[a-z]+)?$/i.test(path);

            // 1. All open PRs in repos owned by `owner`
            const prs = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `is:pr is:open user:${owner} archived:false`,
              per_page: 100,
            });
            core.info(`Found ${prs.length} open PR(s) under ${owner}.`);

            const merged = [], skipped = [], failed = [];

            for (const item of prs) {
              const repo = item.repository_url.split('/').pop();
              const pull_number = item.number;
              const tag = `${owner}/${repo}#${pull_number}`;

              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.draft) { skipped.push(`${tag} — draft`); continue; }

              // 2. Only README files may change (and none may be deleted)
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
              const other = files.filter(f => !isReadme(f.filename) || f.status === 'removed');
              if (files.length === 0 || other.length > 0) {
                skipped.push(`${tag} — touches non-README files: ${other.map(f => f.filename).join(', ') || '(none)'}`);
                continue;
              }

              // 3. Must be cleanly mergeable. GitHub computes this lazily, so poll briefly.
              let mergeable = pr.mergeable;
              for (let i = 0; mergeable === null && i < 5; i++) {
                await new Promise(r => setTimeout(r, 2000));
                mergeable = (await github.rest.pulls.get({ owner, repo, pull_number })).data.mergeable;
              }
              if (mergeable !== true) { skipped.push(`${tag} — not cleanly mergeable (${mergeable})`); continue; }

              if (dryRun) { merged.push(`${tag} — would merge (${files.map(f => f.filename).join(', ')})`); continue; }

              // 4. Merge, then optionally delete the branch (same-repo branches only)
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number, merge_method: mergeMethod });
                if (deleteBranch && pr.head.repo && pr.head.repo.full_name === pr.base.repo.full_name) {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }).catch(() => {});
                }
                merged.push(`${tag} — merged`);
              } catch (e) {
                failed.push(`${tag} — ${e.message}`);
              }
            }

            // 5. Report
            const section = (title, rows) => `### ${title} (${rows.length})\n${rows.map(r => `- ${r}`).join('\n') || '_none_'}\n`;
            await core.summary
              .addRaw(`## README-only PR merge ${dryRun ? '(DRY RUN)' : ''}\n\n`)
              .addRaw(section(dryRun ? 'Would merge' : 'Merged', merged))
              .addRaw(section('Skipped', skipped))
              .addRaw(section('Failed', failed))
              .write();
            core.info([...merged, ...skipped, ...failed].join('\n'));
            if (failed.length) core.setFailed(`${failed.length} PR(s) failed to merge.`);
